name: Deploy Backend to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: aressgenaiacr
  ACR_LOGIN_SERVER: aressgenaiacr.azurecr.io
  IMAGE_NAME: vapiwebhook
  CONTAINER_APP_NAME: vapiwebhook
  RESOURCE_GROUP: aressgenai

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create or Update Azure Container App
        run: |
          if az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} >/dev/null 2>&1; then

            echo "Container App exists. Updating..."

            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --set-env-vars \
                MSSQL_DRIVER="ODBC Driver 18 for SQL Server" \
                MSSQL_SERVER="tcp:aressgenaisqldb.database.windows.net,1433" \
                MSSQL_DATABASE="crumb-support" \
                MSSQL_USERNAME="aressadmin" \
                MSSQL_PASSWORD="Aress123$" \
                MSSQL_ENCRYPT="yes" \
                MSSQL_TRUST_SERVER_CERTIFICATE="no" \
                MSSQL_CONNECTION_TIMEOUT="30" \
                MSSQL_CONNECT_RETRIES="3" \
                MSSQL_CONNECT_RETRY_DELAY_SECONDS="2" \
                REPORT_UI_BASE_URL="http://localhost:8002/call-report" \
                REPORT_API_BASE_URL="http://localhost:8002" \
                TWILIO_ACCOUNT_SID="AC6aec5003a4279b996d27cda48ce4a372" \
                TWILIO_AUTH_TOKEN="bfa863373bd34909658b20580f31d61d" \
                TWILIO_MESSAGING_SERVICE_SID="MG6be342ab14fdaa287b743af88bee5865" \
                TWILIO_TO_NUMBER="+12296823466" \
                TWILIO_SMS_BODY="Revenge of the Sith was the best of the prequel trilogy." \
                TWILIO_FROM_NUMBER="+18555721203" \
                TWILIO_REPORT_SMS_BODY="Thank you for calling Aress. Below is the attached report of your demo call: {report_url}" \
                VAPI_API_KEY="c88c5db1-5d1b-4f4d-995f-31374611671c"

          else

            echo "Container App does not exist. Creating..."

            az containerapp create \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment qa-evaluator-api \
              --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --target-port 8002 \
              --ingress external \
              --registry-server ${{ env.ACR_LOGIN_SERVER }} \
              --registry-username ${{ secrets.ACR_USERNAME }} \
              --registry-password ${{ secrets.ACR_PASSWORD }} \
              --env-vars \
                MSSQL_DRIVER="ODBC Driver 18 for SQL Server" \
                MSSQL_SERVER="tcp:aressgenaisql.database.windows.net,1433" \
                MSSQL_DATABASE="crumb-support1" \
                MSSQL_USERNAME="aressadmin" \
                MSSQL_PASSWORD="Aress123$" \
                MSSQL_ENCRYPT="yes" \
                MSSQL_TRUST_SERVER_CERTIFICATE="no" \
                MSSQL_CONNECTION_TIMEOUT="30" \
                MSSQL_CONNECT_RETRIES="3" \
                MSSQL_CONNECT_RETRY_DELAY_SECONDS="2" \
                REPORT_UI_BASE_URL="http://localhost:8002/call-report" \
                REPORT_API_BASE_URL="http://localhost:8002" \
                TWILIO_ACCOUNT_SID="AC6aec5003a4279b996d27cda48ce4a372" \
                TWILIO_AUTH_TOKEN="bfa863373bd34909658b20580f31d61d" \
                TWILIO_MESSAGING_SERVICE_SID="MG6be342ab14fdaa287b743af88bee5865" \
                TWILIO_TO_NUMBER="+12296823466" \
                TWILIO_SMS_BODY="Revenge of the Sith was the best of the prequel trilogy." \
                TWILIO_FROM_NUMBER="+18555721203" \
                TWILIO_REPORT_SMS_BODY="Thank you for calling Aress. Below is the attached report of your demo call: {report_url}" \
                VAPI_API_KEY="c88c5db1-5d1b-4f4d-995f-31374611671c"

          fi

          echo "Setting revision mode to Single..."

          az containerapp revision set-mode \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --mode single

      - name: Show Active Revision
        run: |
          az containerapp revision list \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[?properties.active].name" \
            -o table
